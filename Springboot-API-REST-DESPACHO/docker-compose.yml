services:
  mysql:
    image: mysql:8.0
    container_name: mysql_despachos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: despachos_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: backend_despachos
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: despachos_db
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/despachos_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net

volumes:
  mysql_data:
    name: despachos_mysql_data

networks:
  backend_net:
    driver: bridge
